<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <clipPath id="badge-clip">
      <circle cx="250" cy="250" r="210"/>
    </clipPath>
    <clipPath id="horizon-clip">
      <rect x="0" y="0" width="500" height="256"/>
    </clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- badge background -->
  <circle cx="250" cy="250" r="210" fill="#1a1818"/>

  <g clip-path="url(#badge-clip)">
    <g clip-path="url(#horizon-clip)">

      <!-- soft glow behind the sun, rises and sets with it -->
      <circle cx="250" r="96" fill="#fabe28" opacity="0.45" filter="url(#glow)">
        <animate attributeName="cy" values="386;386;210;210;386" keyTimes="0;0.3;0.5;0.7;1"
                 calcMode="spline"
                 keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"
                 dur="4.3s" repeatCount="indefinite"/>
      </circle>

      <!-- 12-point ray burst: fades in/out and rises/sets together with the sun -->
      <g>
        <animateTransform attributeName="transform" type="translate"
                           values="0,176;0,176;0,0;0,0;0,176" keyTimes="0;0.3;0.5;0.7;1"
                           calcMode="spline"
                           keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"
                           dur="4.3s" repeatCount="indefinite"/>
        <g stroke="#fabe28" stroke-width="7" stroke-linecap="round" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.5;0.72;1"
                   dur="4.3s" repeatCount="indefinite"/>
          <!-- one base ray, duplicated at 30 degree steps around the sun's peak center (250,210) -->
          <line x1="250" y1="132" x2="250" y2="68"/>
          <line x1="250" y1="132" x2="250" y2="68" transform="rotate(30 250 210)"/>
          <line x1="250" y1="132" x2="250" y2="68" transform="rotate(60 250 210)"/>
          <line x1="250" y1="132" x2="250" y2="68" transform="rotate(90 250 210)"/>
          <line x1="250" y1="132" x2="250" y2="68" transform="rotate(120 250 210)"/>
          <line x1="250" y1="132" x2="250" y2="68" transform="rotate(150 250 210)"/>
          <line x1="250" y1="132" x2="250" y2="68" transform="rotate(180 250 210)"/>
          <line x1="250" y1="132" x2="250" y2="68" transform="rotate(210 250 210)"/>
          <line x1="250" y1="132" x2="250" y2="68" transform="rotate(240 250 210)"/>
          <line x1="250" y1="132" x2="250" y2="68" transform="rotate(270 250 210)"/>
          <line x1="250" y1="132" x2="250" y2="68" transform="rotate(300 250 210)"/>
          <line x1="250" y1="132" x2="250" y2="68" transform="rotate(330 250 210)"/>
        </g>
      </g>

      <!-- rising sun disc -->
      <circle cx="250" cy="386" r="62" fill="#fabe28">
        <animate attributeName="cy" values="386;386;210;210;386" keyTimes="0;0.3;0.5;0.7;1"
                 calcMode="spline"
                 keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"
                 dur="4.3s" repeatCount="indefinite"/>
      </circle>

    </g>
  </g>

  <!-- fixed horizon line -->
  <line x1="74" y1="256" x2="426" y2="256" stroke="#fabe28" stroke-width="5" stroke-linecap="round"/>
</svg>
